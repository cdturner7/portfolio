<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Collin D. Turner &ndash; R&eacute;sum&eacute;</title>
    <meta name="description" content="Collin Turner &mdash; Senior Software &amp; Application Engineer. Resume."/>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            background: #e9eaec;
            color: #1a1a1a;
            font: 14px/1.5 Georgia, "Times New Roman", serif;
            padding: 24px 14px;
        }
        .sheet {
            max-width: 760px;
            margin: 0 auto;
            background: #fff;
            padding: 44px 52px 52px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, .14);
        }

        #resume-container > section { margin-bottom: 22px; }
        #resume-container > section:last-child { margin-bottom: 0; }

        #resume-header {
            text-align: center;
            border-bottom: 2px solid #222;
            padding-bottom: 12px;
        }
        #title-name { margin: 0 0 4px; font-size: 26px; letter-spacing: .5px; }
        #resume-header p { margin: 0; font-size: 12.5px; color: #444; }
        #resume-header a { color: inherit; text-decoration: none; }

        h2, .section-title {
            margin: 0 0 10px;
            font: 700 12px/1.4 Arial, Helvetica, sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            color: #222;
            border-bottom: 1px solid #bbb;
            padding-bottom: 3px;
        }

        .job h3 { margin: 0 0 2px; font-size: 15px; }
        .job > p {
            margin: 0 0 8px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 12.5px;
            color: #333;
        }
        .job > p span { color: #666; white-space: nowrap; font-style: italic; }

        .resume-section p { margin: 4px 0; }
        .resume-section ul { margin: 6px 0 0; padding-left: 20px; }
        .resume-section li { margin: 3px 0; }
        a { color: #0b57d0; }

        @media (max-width: 620px) {
            body { padding: 12px 0; }
            .sheet { padding: 28px 22px; box-shadow: none; }
            .job > p { flex-direction: column; gap: 0; }
        }

        @media print {
            body { background: #fff; padding: 0; }
            .sheet { max-width: none; box-shadow: none; padding: 0; }
            a { color: inherit; text-decoration: none; }
            @page { margin: 0.55in 0.6in; }
        }
    </style>
</head>
<body>
    <main class="sheet">
        <div th:replace="~{fragments/resume :: resume}"></div>
    </main>
</body>
</html>
